name: Release

# Publish a release either way:
#   - Actions -> Release -> Run workflow on main, enter a version such as 1.1.0.
#     The workflow creates the v1.1.0 tag and the release.
#   - Or push a tag such as v1.1.0.
# Do not create the release by hand on GitHub first: the workflow creates it.
# Installed trays pick it up within a few hours (or via "Check for updates").
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 1.1.0). Must be higher than the last release."
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Velopack app id. Never change it: installed PCs only update from releases with this id.
  # It also names the install folder (%LocalAppData%\FarmoraTrayApp), kept apart from
  # the config folder (%LocalAppData%\FarmoraTray) so uninstalling keeps the API key.
  PACK_ID: FarmoraTrayApp
  # Keep in step with the Velopack package version in FarmoraTray.csproj.
  VPK_VERSION: 1.2.161

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version and tag
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Run the release workflow on main, not $GITHUB_REF_NAME."
              exit 1
            fi
            version="${INPUT_VERSION#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3, got '$version'."
            exit 1
          fi
          tag="v$version"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
            echo "::error::Tag $tag already exists. Pick a higher version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Test
        run: dotnet test farmora-tray.slnx --configuration Release -p:SelfContained=false

      - name: Install vpk
        run: dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}

      - name: Build, pack and upload
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          REPO_URL: https://github.com/${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for rid in win-x64 win-x86; do
            # No single-file compression: Velopack packages are already zipped, compression
            # defeats delta updates, and it hides the VelopackApp check from vpk pack.
            dotnet publish src/FarmoraTray/FarmoraTray.csproj -c Release -r "$rid" --self-contained true \
              -p:Version="$VERSION" -p:EnableCompressionInSingleFile=false -o "publish/$rid"

            # Previous release lets vpk build a small delta package. None exists on the first release.
            vpk download github --repoUrl "$REPO_URL" --token "$GH_TOKEN" --channel "$rid" -o releases \
              || echo "No previous $rid release; skipping delta."

            vpk pack --packId "$PACK_ID" --packVersion "$VERSION" --packDir "publish/$rid" \
              --mainExe FarmoraTray.exe --runtime "$rid" --channel "$rid" \
              --packTitle "Farmora Tray" --icon src/FarmoraTray/FarmoraTray.ico \
              --shortcuts StartMenuRoot -o releases

            vpk upload github --repoUrl "$REPO_URL" --token "$GH_TOKEN" --channel "$rid" -o releases \
              --tag "$TAG" --targetCommitish "$GITHUB_SHA" --releaseName "Farmora Tray $VERSION" --publish --merge
          done
