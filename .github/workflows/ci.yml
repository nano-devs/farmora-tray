name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build farmora-tray.slnx --configuration Release -p:SelfContained=false

      - name: Test
        run: dotnet test farmora-tray.slnx --configuration Release -p:SelfContained=false --no-build --logger "console;verbosity=normal"
